<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#12140f;
    --moss:#1c2814;
    --moss-2:#233318;
    --green:#78d326;
    --cream:#f5f4ec;
    --line: rgba(245,244,236,0.12);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--ink);
    color:var(--cream);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit; text-decoration:none;}

  .nav{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 24px;
    border-bottom:1px solid var(--line);
    background:rgba(18,20,15,0.85);
  }
  .nav .brand svg{height:36px; width:auto;}

  .thankyou-card{
    max-width:540px;
    margin:60px auto;
    padding:40px 28px;
    background:linear-gradient(160deg, var(--moss), var(--ink));
    border:1px solid var(--line);
    border-radius:24px;
    text-align:center;
    box-shadow:0 20px 40px rgba(0,0,0,0.4);
  }
  .icon-check{
    width:72px; height:72px;
    background:var(--moss-2);
    border:2px solid var(--green);
    color:var(--green);
    border-radius:50%;
    display:grid; place-items:center;
    margin:0 auto 24px;
  }
  .icon-check svg{width:36px; height:36px;}
  h1{font-family:'Space Grotesk',sans-serif; font-size:clamp(28px, 4vw, 36px); margin-bottom:12px;}
  h1 span{color:var(--green);}
  p.msg{font-size:16px; line-height:1.6; color:rgba(245,244,236,0.75); margin-bottom:28px;}
  .summary-box{
    background:rgba(0,0,0,0.25);
    border:1px dashed var(--line);
    border-radius:14px;
    padding:16px; margin-bottom:30px; text-align:left;
  }
  .summary-row{display:flex; justify-content:space-between; font-size:14px; margin-bottom:8px;}
  .summary-row:last-child{margin-bottom:0;}
  .summary-row .label{color:rgba(245,244,236,0.6);}
  .summary-row .val{font-weight:600; font-family:'JetBrains Mono',monospace;}

  .btn-home{
    display:inline-flex; align-items:center; justify-content:center; gap:10px;
    width:100%; padding:16px; border-radius:100px;
    background:var(--green); color:var(--ink);
    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:15px;
    transition:transform .2s ease;
  }
  .btn-home:hover{transform:translateY(-2px);}

  footer{text-align:center; padding:24px; border-top:1px solid var(--line); font-size:13px; color:rgba(245,244,236,0.5);}
</style>
</head>
<body>

  <nav class="nav">
    <div class="brand">
      <a href="index.html">
        <svg viewBox="0 0 220 50" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="Jaayma Logo">
          <text x="10" y="38" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="34" fill="#78d326" letter-spacing="-0.02em">Jaayma</text>
        </svg>
      </a>
    </div>
  </nav>

  <main class="wrap">
    <div class="thankyou-card">
      <div class="icon-check">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
      </div>
      <h1>Commande <span>Confirmée !</span></h1>
      <p class="msg">Merci pour votre confiance. Votre demande a bien été enregistrée et notre équipe prépare l'expédition de votre produit.</p>

      <div class="summary-box">
        <div class="summary-row">
          <span class="label">Produit</span>
          <span class="val">P15 Mini Quadripod</span>
        </div>
        <div class="summary-row">
          <span class="label">Montant</span>
          <span class="val">12 000 FCFA</span>
        </div>
        <div class="summary-row">
          <span class="label">Livraison</span>
          <span class="val">Dakar & Régions</span>
        </div>
      </div>

      <a href="index.html" class="btn-home">
        Retour à l'accueil
      </a>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 Jaayma. Tous droits réservés.</p>
  </footer>

</body>
</html>
